<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Page not found</title>
		<script>
			// Project sites are case-sensitive, so /rime/... lands here instead of on Rime's site.
			const match = location.pathname.match(/^\/rime(\/.*)?$/i);
			if (match && !location.pathname.startsWith("/Rime/")) {
				location.replace("/Rime" + (match[1] || "/") + location.search + location.hash);
			}
		</script>
	</head>
	<body>
		<p>Page not found. <a href="/">Go to the home page</a>.</p>
	</body>
</html>
